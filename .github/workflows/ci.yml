name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # GitHub's Windows runners have no GPU: the renderer tests run on WARP (software Direct3D),
      # which also exercises the fallback path.
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: wackdown-exe
          path: target/x86_64-pc-windows-msvc/release/wackdown.exe
